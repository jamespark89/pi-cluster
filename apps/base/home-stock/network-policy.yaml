# Pods in this namespace only accept the connections they need:
#   Cloudflare tunnel -> app -> database <- nightly backup
# Anything else, such as pods in other namespaces, can't reach them.
# Outbound traffic isn't limited.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-from-tunnel
spec:
  podSelector:
    matchLabels:
      app: home-stock
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
        # The daily price search (offers.yaml).
        - podSelector:
            matchLabels:
              app: home-stock-offers
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-app-and-backup
spec:
  podSelector:
    matchLabels:
      app: home-stock-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: home-stock
        - podSelector:
            matchLabels:
              app: home-stock-db-backup
      ports:
        - port: 5432
---
# changedetection's page: through the tunnel, and from the app (for prices).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changedetection-from-tunnel-and-app
spec:
  podSelector:
    matchLabels:
      app: changedetection
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
        - podSelector:
            matchLabels:
              app: home-stock
      ports:
        - port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-from-changedetection
spec:
  podSelector:
    matchLabels:
      app: sockpuppetbrowser
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: changedetection
      ports:
        - port: 3000
