# changedetection.io: checks the shops' product pages each day and keeps the
# prices (step 2 of price tracking; Home Stock reads them through its API later).
# Pages that need JavaScript, like Coles and Woolworths, are loaded in a real
# Chrome from sockpuppetbrowser below. Its own AI features are off.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
spec:
  replicas: 1
  # One pod owns the data volume, so stop the old one before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: changedetection
          # Pinned, so an update is a deliberate change here rather than a surprise.
          image: ghcr.io/dgtlmoon/changedetection.io:0.70.3
          ports:
            - containerPort: 5000
          env:
            - name: PLAYWRIGHT_DRIVER_URL
              value: ws://sockpuppetbrowser:3000
            - name: BASE_URL
              value: https://prices.jamespark.dev
            - name: TZ
              value: Australia/Sydney
            - name: FETCH_WORKERS
              value: "2"
            # Shops can't see where the request came from.
            - name: HIDE_REFERER
              value: "true"
            - name: DISABLE_VERSION_CHECK
              value: "true"
            - name: LLM_FEATURES_DISABLED
              value: "true"
            - name: HOME
              value: /tmp
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /datastore
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: changedetection-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
spec:
  ports:
    - port: 5000
  selector:
    app: changedetection
  type: ClusterIP
---
# Headless Chrome for changedetection. It starts Chrome with --no-sandbox, so it
# runs under the namespace's restricted rules without extra privileges.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockpuppetbrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sockpuppetbrowser
  template:
    metadata:
      labels:
        app: sockpuppetbrowser
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's "chrome" user, given as a number so Kubernetes can check it.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sockpuppetbrowser
          image: dgtlmoon/sockpuppetbrowser:0.0.5
          ports:
            - containerPort: 3000
          env:
            - name: MAX_CONCURRENT_CHROME_PROCESSES
              value: "2"
            - name: SCREEN_WIDTH
              value: "1280"
            - name: SCREEN_HEIGHT
              value: "1024"
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppetbrowser
spec:
  ports:
    - port: 3000
  selector:
    app: sockpuppetbrowser
  type: ClusterIP
